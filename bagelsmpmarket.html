<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BagelSMP Market</title>
<style>
  :root{--card:#201812;--acc:#ffb347;--grn:#7CFC00}
  body{margin:0;color:#f5e9d4;font-family:Arial,sans-serif;min-height:100vh;
    background:linear-gradient(#050914 0%,#0b1030 45%,#1a1440 75%,#2b1a3a 100%);overflow-x:hidden}
  #sky{position:fixed;inset:0;z-index:-1;overflow:hidden}
  .star{position:absolute;background:#fff;border-radius:50%;animation:tw 2.5s infinite}
  @keyframes tw{0%,100%{opacity:.2}50%{opacity:1}}
  #moon{position:absolute;top:40px;right:60px;width:90px;height:90px;background:radial-gradient(circle at 35% 35%,#fffbe8,#e8dfae 70%);border-radius:50%;box-shadow:0 0 40px 12px rgba(255,250,200,.35)}
  header{background:rgba(36,26,16,.85);padding:16px;text-align:center;border-bottom:3px solid var(--acc)}
  #wrap{max-width:1000px;margin:auto;padding:14px}
  #controls{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0;align-items:center}
  input,select,textarea{background:#2c2117;color:#fff;border:1px solid #555;border-radius:6px;padding:8px}
  button{background:var(--acc);border:0;border-radius:6px;padding:8px 14px;font-weight:700;cursor:pointer}
  button.ghost{background:#3a2d1e;color:#fff}
  #grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
  .card{background:rgba(32,24,18,.95);border:1px solid #4a3826;border-radius:10px;padding:12px}
  .price{color:var(--grn);font-weight:800} .cat{font-size:12px;background:#3a2d1e;border-radius:10px;padding:2px 8px}
  .desc{font-size:13px;color:#d8c8a8;margin:6px 0;min-height:32px}
  form{background:rgba(29,21,14,.92);border:1px solid #4a3826;border-radius:10px;padding:12px;margin:14px 0;display:grid;gap:8px;grid-template-columns:1fr 1fr}
  form .full{grid-column:1/-1} .err{color:#ff6b6b;font-size:13px}
  .head{display:flex;gap:8px;align-items:center} .head img{width:32px;height:32px;border-radius:4px}
  footer{text-align:center;color:#8a7a5f;font-size:12px;padding:16px}
  #loader{position:fixed;inset:0;background:#050914;display:flex;align-items:center;justify-content:center;z-index:99;font-size:26px;font-weight:800;text-align:center;transition:opacity .5s}
  #loader span{font-size:15px;color:#ffb347;font-weight:400}
  #loader.hide{opacity:0;pointer-events:none}
</style>
</head>
<body>
<div id="sky"><div id="moon"></div></div>
<div id="loader"><div> 🥯 BagelSMP Market<br><span>Created by FineSteve9009 / Sizls_00</span></div></div>
<header><h1> 🥯 BagelSMP Market</h1><p>In-game IGNs only </p></header>
<div id="wrap">
  <form id="form">
    <input id="seller" class="full" placeholder="Minecraft IGN (3-16 chars)" maxlength="16" required>
    <div class="err full" id="ignErr" style="display:none">Invalid IGN.</div>
    <input id="item" placeholder="Item (e.g. 64x Netherite Scrap)" required maxlength="60">
    <input id="price" placeholder="ex: $1K" required maxlength="30">
    <input id="qty" type="number" min="1" value="1">
    <select id="cat" onchange="catChange()"><option>Blocks</option><option>Ores</option><option>Food</option><option>Enchanted</option><option>Redstone</option><option>Mobs</option><option>Other</option></select>
    <input id="customCat" placeholder="Custom category (e.g. Pets)" maxlength="20" style="display:none">
    <textarea id="desc" class="full" placeholder="Description / location"></textarea>
    <button class="full" type="submit">+ List item (you'll get a delete PIN)</button>
  </form>
  <div id="controls">
    <input id="q" placeholder="Search..." style="flex:1">
    <select id="fcat"><option value="">All</option></select>
    <select id="sort"><option value="new">Newest</option><option value="az">Price A-Z</option></select>
    <button class="ghost" onclick="exportJSON()">Export</button>
    <button class="ghost" onclick="importBox()">Import</button>
  </div>
  <div id="importDiv" style="display:none"><textarea id="importTxt" rows="4" style="width:100%"></textarea><button onclick="doImport()">Load</button></div>
  <div id="count"></div><div id="grid"></div>
</div>
<footer>Created by FineSteve9009 / Sizls_00</footer>
<audio id="aud" loop preload="auto" style="display:none"></audio>
<script>
(function(){var s=document.getElementById('sky');for(var i=0;i<150;i++){var d=document.createElement('div');d.className='star';var sz=Math.random()*2+1;d.style.width=d.style.height=sz+'px';d.style.left=Math.random()*100+'%';d.style.top=Math.random()*70+'%';d.style.animationDelay=(Math.random()*2.5)+'s';s.appendChild(d);}})();
(function(){
  var a=document.getElementById('aud');
  var tries=['music.mp3','./music.mp3','GigaChad Theme ringtone.mp3','giga-chad-theme.mp3'];
  var i=0;a.volume=0.6;
  a.addEventListener('error',function(){i++;if(i<tries.length){a.src=tries[i];tryPlay();}});
  function tryPlay(ok){var p=a.play();if(p&&p.then)p.then(function(){if(ok)ok();}).catch(function(){});}
  a.src=tries[0];tryPlay();
  function kick(){tryPlay(function(){document.removeEventListener('pointerdown',kick);document.removeEventListener('keydown',kick);});}
  document.addEventListener('pointerdown',kick);document.addEventListener('keydown',kick);
})();
function catChange(){
  var v=document.getElementById('cat').value;
  document.getElementById('customCat').style.display=(v==='Other')?'block':'none';
}
var KEY='bagelMarketV4',items=[];
try{items=JSON.parse(localStorage.getItem(KEY))||[]}catch(e){items=[];}
function save(){localStorage.setItem(KEY,JSON.stringify(items));}
var BASECATS=['Blocks','Ores','Food','Enchanted','Redstone','Mobs','Other'];
function refreshFilters(){
  var fc=document.getElementById('fcat'),cur=fc.value;
  fc.innerHTML='<option value="">All</option>';
  var all=BASECATS.slice();
  items.forEach(function(o){if(o.cat&&all.indexOf(o.cat)<0)all.push(o.cat);});
  all.forEach(function(c){var o=document.createElement('option');o.textContent=c;fc.appendChild(o);});
  fc.value=cur;
}
refreshFilters();
function isIGN(s){return /^[a-zA-Z0-9_]{3,16}$/.test(s);}
function priceOf(o){return String(o.priceStr!=null?o.priceStr:o.price||'');}
function priceNum(o){var s=priceOf(o).replace(/[$, ]/g,'').toUpperCase(),m=s.match(/^([0-9]*\.?[0-9]+)([KMBT])?$/);if(!m)return Infinity;var n=parseFloat(m[1]),x={K:1e3,M:1e6,B:1e9,T:1e12};return n*(x[m[2]]||1);}
function chosenCat(){
  var v=document.getElementById('cat').value;
  if(v==='Other'){var c=document.getElementById('customCat').value.trim().slice(0,20);return c||'Other';}
  return v;
}
document.getElementById('form').onsubmit=function(e){
  e.preventDefault();
  var v=function(id){return document.getElementById(id).value.trim();};
  var ign=v('seller');if(!isIGN(ign)){document.getElementById('ignErr').style.display='block';return;}
  document.getElementById('ignErr').style.display='none';
  if(!v('price')){alert('Enter a price');return;}
  var pin=''+Math.floor(1000+Math.random()*9000);
  items.unshift({id:Date.now()+Math.random(),seller:ign,item:v('item').slice(0,60),priceStr:v('price').slice(0,30),qty:Math.max(1,+v('qty')||1),cat:chosenCat(),desc:v('desc').slice(0,500),pin:pin,t:Date.now()});
  save();refreshFilters();render();e.target.reset();catChange();alert('Listed! Delete PIN: '+pin);
};
document.getElementById('q').oninput=render;document.getElementById('fcat').onchange=render;document.getElementById('sort').onchange=render;
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function render(){
  var q=document.getElementById('q').value.toLowerCase(),c=document.getElementById('fcat').value,s=document.getElementById('sort').value;
  var list=items.filter(function(it){return(!c||it.cat===c)&&(!q||(it.item+' '+it.seller+' '+priceOf(it)+' '+it.cat+' '+(it.desc||'')).toLowerCase().indexOf(q)>-1);});
  if(s==='az')list.sort(function(a,b){var x=priceNum(a),y=priceNum(b);if(x===Infinity&&y===Infinity)return priceOf(a).localeCompare(priceOf(b));return x-y;});else list.sort(function(a,b){return b.t-a.t;});
  document.getElementById('count').textContent=list.length+' listing(s)';
  var g=document.getElementById('grid');g.innerHTML='';
  list.forEach(function(it){
    var d=document.createElement('div');d.className='card';
    d.innerHTML='<div class=head><img src="https://minotar.net/helm/'+encodeURIComponent(it.seller)+'/32.png" onerror="this.style.display=\'none\'"><h3>'+esc(it.item)+'</h3></div>'+
    '<span class=cat>'+esc(it.cat)+'</span><div class=price>'+esc(priceOf(it))+' × '+it.qty+'</div>'+
    '<div>'+esc(it.seller)+' <span style=color:#aaa;font-size:12px">/msg '+esc(it.seller)+'</span></div>'+
    '<div class=desc>'+esc(it.desc||'')+'</div><button class=ghost onclick="delItem('+it.id+')">Sold / Remove (PIN)</button>';
    g.appendChild(d);
  });
}
function delItem(id){var it=null;for(var i=0;i<items.length;i++)if(items[i].id===id)it=items[i];if(!it)return;var p=prompt('PIN for '+it.seller+':');if(p===null)return;if(p!==it.pin){alert('Wrong PIN.');return;}items=items.filter(function(x){return x.id!==id;});save();refreshFilters();render();}
function exportJSON(){prompt('Copy JSON:',JSON.stringify(items));}
function importBox(){var d=document.getElementById('importDiv');d.style.display=d.style.display==='none'?'block':'none';}
function doImport(){
  var t=document.getElementById('importTxt').value.trim();if(!t)return;
  try{var arr=JSON.parse(t);if(Array.isArray(arr)){arr.forEach(function(o){if(o.seller&&o.item&&isIGN(String(o.seller)))items.unshift({id:Date.now()+Math.random(),seller:String(o.seller).slice(0,16),item:String(o.item).slice(0,60),priceStr:String(o.priceStr!=null?o.priceStr:o.price||'').slice(0,30),qty:Math.max(1,+o.qty||1),cat:String(o.cat||'Other').trim().slice(0,20)||'Other',desc:String(o.desc||'').slice(0,500),pin:''+Math.floor(1000+Math.random()*9000),t:Date.now()});});save();refreshFilters();render();return;}}catch(e){}
  t.split('\n').forEach(function(line){var p=line.split('|').map(function(s){return s.trim();});if(p.length<2||!isIGN(p[0]))return;items.push({id:Date.now()+Math.random(),seller:p[0].slice(0,16),item:p[1].slice(0,60),priceStr:(p[2]||'$1').slice(0,30),qty:Math.max(1,+p[3]||1),cat:(p[4]||'Other').trim().slice(0,20)||'Other',desc:(p[5]||'').slice(0,500),pin:''+Math.floor(1000+Math.random()*9000),t:Date.now()});});
  save();refreshFilters();render();
}
render();
window.addEventListener('load',function(){setTimeout(function(){document.getElementById('loader').classList.add('hide');},1200);});
setTimeout(function(){var l=document.getElementById('loader');if(l)l.classList.add('hide');},2500);
</script>
</body>
</html>
